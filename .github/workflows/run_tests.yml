name: Run Node Script and Save Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run script
        run: node scripts/my-script.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: api-results-${{ github.run_number }}
          path: output.json
          retention-days: 90