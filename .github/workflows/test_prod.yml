name: Test PROD Environment

on:
  #workflow_run:
  #  workflows: ["Deploy to PROD"]
  #  types:
  #    - completed
  workflow_dispatch:

env:
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT_PROD }}

jobs:
  test-prod:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Google Cloud PROD
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY_PROD }}

      - name: Run tests against PROD environment
        run: node curl_intent_test.js
        env:
          TEST_ENVIRONMENT: "PROD"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: prod-test-results-${{ github.run_number }}
          path: curl_results.txt
          retention-days: 90

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = 'Test results not found';
            try {
              results = fs.readFileSync('curl_results.txt', 'utf8');
            } catch (error) {
              console.log('Could not read test results:', error.message);
            }
            
            const issueBody = `## 🚨 PROD Environment Test Failure
            
            The production deployment tests have failed after the latest deployment.
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            **Test Results:**
            \`\`\`
            ${results}
            \`\`\`
            
            **Next Steps:**
            1. Investigate the test failures
            2. Consider rolling back if critical functionality is broken
            3. Fix issues and re-deploy
            
            *Auto-generated by PROD test workflow*`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 PROD Test Failure - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['production', 'test-failure', 'urgent']
            });
