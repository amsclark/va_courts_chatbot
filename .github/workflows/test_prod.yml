name: Test PROD Environment

on:
  #workflow_run:
  #  workflows: ["Deploy to PROD"]
  #  types:
  #    - completed
  workflow_dispatch:

env:
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT_PROD }}
  TEST_URL: "9a6751d7-5b0c-4bd3-8d17-5a3dd3222658" 

jobs:
  test-prod:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with Google Cloud PROD
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY_PROD }}

      - name: Run tests against PROD environment
        run: |
          echo "🧪 Starting STRICT intent testing against PROD environment..."
          echo "📋 Requirement: ALL test prompts must match expected intents perfectly"
          echo "❌ No wrong intents, no fallbacks, no missing intents allowed"
          echo "🚨 Production quality standards enforced"
          echo ""
          node curl_intent_test.js "${{ env.TEST_URL }}"
        env:
          TEST_ENVIRONMENT: "PROD"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: prod-test-results-${{ github.run_number }}
          path: curl_results.txt
          retention-days: 90

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = 'Test results not found';
            try {
              results = fs.readFileSync('curl_results.txt', 'utf8');
            } catch (error) {
              console.log('Could not read test results:', error.message);
            }
            
            const issueBody = `## 🚨 PROD Environment Test Failure - CRITICAL
            
            **STRICT VALIDATION FAILED** - The production deployment tests have failed after the latest deployment.
            
            **Requirements:** All test prompts must match expected intents perfectly (100% accuracy required).
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            **Impact:** Production users may experience incorrect intent matching, leading to poor chatbot responses.
            
            <details>
            <summary>Detailed Test Results</summary>
            
            \`\`\`
            ${results}
            \`\`\`
            
            </details>
            
            **URGENT Next Steps:**
            1. 🚨 **Immediate:** Investigate which intents are failing
            2. 🔄 **Consider:** Rolling back to previous working version if critical
            3. 🔧 **Fix:** Update training phrases or intent matching logic
            4. ✅ **Verify:** Re-run tests to confirm 100% accuracy before proceeding
            
            **Acceptable Results:** Only 100% perfect intent matches are acceptable for production.
            
            *Auto-generated by PROD test workflow with strict validation*`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 PROD Test Failure - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['production', 'test-failure', 'urgent']
            });
